name: agrisense_app
description: AgriSense AI - Intelligent Agricultural Assistant
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  
  # State Management
  provider: ^6.1.1
  
  # Networking & Local Storage
  http: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Bundled offline knowledge base (pre-populated SQLite shipped in the APK)
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.8.3
  
  # Image & Camera
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  
  # Location
  geolocator: ^10.1.0
  
  # Real-time chat (WebSockets)
  web_socket_channel: ^2.4.0
  
  # Utils
  intl: ^0.20.2
  percent_indicator: ^4.2.3
  flutter_svg: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  # Lets the bundled-database tests run SQLite on the host VM (no emulator).
  sqflite_common_ffi: ^2.3.0

flutter_launcher_icons:
  image_path: "assets/app_icon/agrisense_icon.png"
  android: true
  ios: true
  web:
    generate: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  
  assets:
    - assets/app_icon/
    # Pre-populated SQLite knowledge base. Packaged into the APK and copied to
    # internal storage on first launch by lib/services/local/offline_database.dart.
    # Regenerate with: python tools/build_offline_db.py
    - assets/db/agrisense_offline.db
