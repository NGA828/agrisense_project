# ──────────────────────────────────────────────────────────────
# AgriSense AI — full local/production stack
#
#   docker compose up -d --build
#   docker compose exec backend python manage.py migrate
#   docker compose exec backend python manage.py seed_data
#   docker compose exec backend python manage.py createsuperuser
#
# API:  http://localhost:8000/api/  (health: http://localhost:8000/api/health/)
# Admin: http://localhost:8000/admin/
# ──────────────────────────────────────────────────────────────
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: agrisense_db
      MYSQL_USER: agrisense_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-password123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backend image used by the web/ASGI, worker and beat services.
  backend:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             daphne -b 0.0.0.0 -p 8000 agrisense_backend.asgi:application"
    volumes:
      - ./backend/agrisense_backend/media:/app/media
      - ./backend/agrisense_backend/staticfiles:/app/staticfiles
    environment: &backend-env
      DEBUG: ${DEBUG:-"False"}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: agrisense_db
      DB_USER: agrisense_user
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DB_HOST: db
      DB_PORT: "3306"
      # Restrict origins in production (browser clients). Mobile apps are
      # unaffected by CORS; keep this explicit rather than wide-open.
      CORS_ALLOW_ALL: ${CORS_ALLOW_ALL:-"false"}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      CHANNEL_LAYER_BACKEND: redis
      CHANNEL_LAYER_REDIS_URL: redis://redis:6379/0
      # Phase C — cache + async workers on Redis
      CACHE_BACKEND: redis
      REDIS_CACHE_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      JWT_ACCESS_MINUTES: "30"
      JWT_REFRESH_DAYS: "7"
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-dev-webhook-secret}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-noop}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery worker — runs background tasks (fan-out, reservations, reconcile).
  worker:
    build: .
    restart: unless-stopped
    command: celery -A agrisense_backend worker -l info
    environment: *backend-env
    volumes:
      - ./backend/agrisense_backend/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery beat — schedules periodic tasks (reservations, premiums, reconcile,
  # weather cleanup) via CELERY_BEAT_SCHEDULE.
  beat:
    build: .
    restart: unless-stopped
    command: celery -A agrisense_backend beat -l info
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
